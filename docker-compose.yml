version: '3.8'

# ========================================
# Docker Compose Configuration
# UrbanGreen Laravel Application
# ========================================

services:
    # ========================================
    # PHP-FPM Application Service
    # ========================================
    app:
        build:
            context: .
            dockerfile: Dockerfile
            # Use BuildKit for better caching
            cache_from:
                - ghcr.io/your-username/urbangreen:latest
        image: urbangreen:local
        container_name: urbangreen_app
        restart: unless-stopped
        working_dir: /var/www/html

        # Environment variables from .env.docker
        environment:
            # Application
            APP_NAME: ${APP_NAME:-UrbanGreen}
            APP_ENV: ${APP_ENV:-production}
            APP_KEY: ${APP_KEY}
            APP_DEBUG: ${APP_DEBUG:-false}
            APP_URL: ${APP_URL:-http://localhost:8000}

            # Gemini API
            GEMINI_API_KEY: ${GEMINI_API_KEY}

            # Database
            DB_CONNECTION: ${DB_CONNECTION:-mysql}
            DB_HOST: ${DB_HOST:-mysql}
            DB_PORT: ${DB_PORT:-3306}
            DB_DATABASE: ${DB_DATABASE:-urbangreen_db}
            DB_USERNAME: ${DB_USERNAME:-root}
            DB_PASSWORD: ${DB_PASSWORD}

            # Redis
            REDIS_HOST: ${REDIS_HOST:-redis}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_PASSWORD: ${REDIS_PASSWORD:-null}

            # Cache & Queue
            CACHE_STORE: ${CACHE_STORE:-redis}
            QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
            SESSION_DRIVER: ${SESSION_DRIVER:-redis}

            # Twilio
            TWILIO_SID: ${TWILIO_SID}
            TWILIO_TOKEN: ${TWILIO_TOKEN}
            TWILIO_FROM: ${TWILIO_FROM}

            # OpenAI
            OPENAI_API_KEY: ${OPENAI_API_KEY}

            # Stripe
            STRIPE_SECRET: ${STRIPE_SECRET}
            STRIPE_PUBLIC: ${STRIPE_PUBLIC}

            # Brevo
            BREVO_API_KEY: ${BREVO_API_KEY}

            # Logging
            LOG_CHANNEL: ${LOG_CHANNEL:-stack}
            LOG_LEVEL: ${LOG_LEVEL:-info}

        # Volumes for persistent data
        volumes:
            # Storage directory for user uploads
            - app-storage:/var/www/html/storage/app
            - ./.env:/var/www/html/.env:ro

        # Network configuration
        networks:
            - urbangreen-network

        # Depends on database and cache
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

        # Health check


    # ========================================
    # Nginx Web Server Service
    # ========================================
    nginx:
        image: nginx:alpine
        container_name: urbangreen_nginx
        restart: unless-stopped

        # Port mapping - Application accessible on port 8000
        ports:
            - "8000:80"

        # Nginx configuration
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
            - app-storage:/var/www/html/storage/app:ro

        # Network configuration
        networks:
            - urbangreen-network

        # Depends on PHP-FPM
        depends_on:
            - app

        # Health check
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    # ========================================
    # MySQL Database Service
    # ========================================
    mysql:
        image: mysql:8.3.0
        container_name: urbangreen_mysql
        restart: unless-stopped

        # Port mapping - MySQL accessible on port 3306
        ports:
            - "3306:3306"

        # Environment variables
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-urbangreen_db}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-MyS3cur3P@ssw0rd!2024}

        # Persistent volume for database data
        volumes:
            - mysql-data:/var/lib/mysql

        # MySQL configuration for better performance
        command: >
            --default-authentication-plugin=mysql_native_password
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_unicode_ci
            --max_connections=200
            --innodb-buffer-pool-size=256M

        # Network configuration
        networks:
            - urbangreen-network

        # Health check
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-MyS3cur3P@ssw0rd!2024}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    # ========================================
    # Redis Cache & Queue Service
    # ========================================
    redis:
        image: redis:alpine
        container_name: urbangreen_redis
        restart: unless-stopped

        # Port mapping - Redis accessible on port 6379
        ports:
            - "6379:6379"

        # Redis configuration
        command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-null}

        # Persistent volume for Redis data
        volumes:
            - redis-data:/data

        # Network configuration
        networks:
            - urbangreen-network

        # Health check
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s

# ========================================
# Networks Configuration
# ========================================
networks:
    urbangreen-network:
        driver: bridge
        name: urbangreen_network

# ========================================
# Volumes Configuration
# Persistent data storage
# ========================================
volumes:
    # MySQL data persistence
    mysql-data:
        driver: local
        name: urbangreen_mysql_data

    # Redis data persistence
    redis-data:
        driver: local
        name: urbangreen_redis_data

    # Application storage (uploads, logs, cache)
    app-storage:
        driver: local
        name: urbangreen_app_storage
