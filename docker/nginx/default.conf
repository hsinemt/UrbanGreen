# ========================================
# Nginx Configuration for Laravel
# UrbanGreen Application
# ========================================

# Upstream PHP-FPM server
upstream php-fpm {
    server app:9000;
}

# Main server block
server {
    # Listen on port 80
    listen 80;
    listen [::]:80;

    # Server name (can be modified for production domain)
    server_name localhost;

    # Document root - Laravel public directory
    root /var/www/html/public;

    # Default index files
    index index.php index.html index.htm;

    # Charset
    charset utf-8;

    # Logging
    access_log /var/log/nginx/urbangreen-access.log;
    error_log /var/log/nginx/urbangreen-error.log;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    # Main location block
    location / {
        # Try to serve file directly, fallback to index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM configuration
    location ~ \.php$ {
        # Security: Don't allow direct access to PHP files in subdirectories
        try_files $uri =404;

        # FastCGI settings
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;

        # FastCGI parameters
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Increase timeouts for long-running requests
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # Buffer settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # Hide PHP version
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to specific Laravel files
    location ~ ^/(\.env|\.git|composer\.json|composer\.lock|package\.json|package-lock\.json|phpunit\.xml|README\.md|DEVOPS\.md) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    # Favicon handling
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Robots.txt handling
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Client body size (max upload size)
    client_max_body_size 20M;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # Deny access to storage directory
    location ~ ^/storage/.* {
        deny all;
    }

    # Allow access to storage/app/public through public/storage symlink
    location ~ ^/storage/(.*)$ {
        try_files /storage/$1 =404;
    }
}
