; ========================================
; Supervisor Configuration
; UrbanGreen Laravel Application
; Manages PHP-FPM, Queue Workers, and Scheduler
; ========================================

[supervisord]
nodaemon=true
user=root
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
logfile_maxbytes=50MB
logfile_backups=10

; ========================================
; PHP-FPM Process
; ========================================
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
user=root
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/www/html/storage/logs/php-fpm.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/www/html/storage/logs/php-fpm-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
startretries=3
stopwaitsecs=10

; ========================================
; Laravel Queue Worker
; Processes jobs from Redis queue
; ========================================
[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=60
user=www-data
numprocs=2
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/www/html/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/www/html/storage/logs/queue-worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
stopwaitsecs=60
stopasgroup=true
killasgroup=true
startretries=3

; ========================================
; Laravel Scheduler
; Runs every minute to execute scheduled tasks
; ========================================
[program:laravel-scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
user=www-data
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/www/html/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/www/html/storage/logs/scheduler-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
stopwaitsecs=10
startretries=3

; ========================================
; Event Listener for Process State Changes
; ========================================
[eventlistener:processes]
command=sh -c "while true; do echo READY; read line; echo RESULT 2; echo OK; done"
events=PROCESS_STATE_FATAL
buffer_size=100

; ========================================
; Supervisor RPC Interface
; ========================================
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ========================================
; Group Configuration
; All Laravel processes in one group
; ========================================
[group:laravel]
programs=php-fpm,laravel-queue-worker,laravel-scheduler
priority=999
